<!-- ============================================================================
     RIDE VEHICLE CARD — shared front-end component  (Jira G40-142)
     ----------------------------------------------------------------------------
     Shows the accepting Gopher's REAL car photos (front + rear) + Year/Make/Model,
     Color, and plate on the requestor's ACTIVE ride screen — so the rider can
     identify the vehicle Uber-style. Ride requests only, after acceptance.

     GLOBALS (singleton, safe to include once):
       window.__vehicleCard(v)  -> returns the vehicle-card HTML for a vehicle
                                   object v = { frontPhoto, rearPhoto, year, make,
                                   model, color, plate }.
       window.__demoCarPhoto(color, view) -> DEMO ONLY: a generated color-matched
                                   car SVG (view = 'front' | 'rear') so the card
                                   renders with no photo server. DELETE in prod.

     Tapping a photo opens the shared fullscreen zoom viewer (window.__receiptViewer,
     from receipt-flow-component.html) via the delegated [data-rcpt-open] handler —
     both components ship together on the ride surface.

     DEV SEAM (the only backend hookup): the Gopher uploads REAL front + rear car
     photos in Gopher Go → Work Settings & Radius (already in gopher-go.html). Store
     the two photo URLs on the driver profile; on ride ACCEPT, return them as
     v.frontPhoto / v.rearPhoto (+ year/make/model/color/plate). Null photo → the
     demo car shows; pass the real URL and the demo generator never runs. The message
     button already exists on the active screen (the crew card's Text button).
     ============================================================================ -->
<style id="veh-styles">
  .veh-card{margin:10px 0 4px;border:1px solid rgba(0,0,0,.10);border-radius:14px;
    background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden}
  .veh-head{display:flex;align-items:center;gap:7px;padding:10px 13px;
    font:700 13px/1.2 system-ui,-apple-system,sans-serif;color:#111;
    border-bottom:1px solid rgba(0,0,0,.07);background:#fafafa}
  .veh-head .veh-ico{font-size:15px}
  .veh-photos{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:11px}
  .veh-photo{position:relative;padding:0;border:1px solid rgba(0,0,0,.10);border-radius:10px;
    overflow:hidden;background:#eef1f4;cursor:zoom-in;aspect-ratio:4/3;display:block}
  .veh-photo img{width:100%;height:100%;object-fit:cover;display:block}
  .veh-photo .veh-tag{position:absolute;left:0;bottom:0;right:0;padding:2px 6px;
    font:600 9.5px/1.4 system-ui,-apple-system,sans-serif;color:#fff;text-align:left;
    background:linear-gradient(transparent,rgba(0,0,0,.55))}
  .veh-meta{padding:0 13px 12px;display:flex;flex-direction:column;gap:5px}
  .veh-line{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .veh-name{font:700 15px/1.2 system-ui,-apple-system,sans-serif;color:#111}
  .veh-color{display:inline-flex;align-items:center;gap:6px;
    font:600 13px/1.2 system-ui,-apple-system,sans-serif;color:#374151}
  .veh-swatch{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.25);display:inline-block}
  .veh-plate{font:600 12.5px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:#4b5563}
  .veh-plate b{color:#111;letter-spacing:.06em;font-weight:700}
</style>
<script>
(function(){
  if(window.__vehicleCard) return;                               // singleton

  var COLORS = { white:'#e9ebee', silver:'#c7ccd1', gray:'#8b9099', grey:'#8b9099',
    black:'#23262b', red:'#c0392b', blue:'#2c5aa0', navy:'#22385f', green:'#2e7d55',
    gold:'#c8a24a', tan:'#c9b48c', charcoal:'#3a3d43', maroon:'#7b2233' };
  function hexFor(c){ return COLORS[String(c||'').trim().toLowerCase()] || (c || '#9aa0a8'); }

  // DEMO ONLY: color-matched car SVG (front or rear). Delete in production.
  window.__demoCarPhoto = function(color, view){
    var body = hexFor(color), glass='#b9c6d6', dark='rgba(0,0,0,.28)';
    var rear = (view === 'rear');
    var lamps = rear
      ? "<rect x='40' y='96' width='34' height='16' rx='4' fill='#b23'/><rect x='246' y='96' width='34' height='16' rx='4' fill='#b23'/>"
      : "<rect x='40' y='96' width='34' height='16' rx='4' fill='#f4e9c1'/><rect x='246' y='96' width='34' height='16' rx='4' fill='#f4e9c1'/>";
    var plateTxt = rear ? "<text x='160' y='142' font-size='15' text-anchor='middle' font-family='monospace' fill='#222'>HXR&#8226;4471</text>" : "";
    var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='320' height='240' viewBox='0 0 320 240'>"+
      "<rect width='320' height='240' fill='#eef1f4'/>"+
      "<ellipse cx='160' cy='210' rx='120' ry='14' fill='rgba(0,0,0,.10)'/>"+
      "<rect x='70' y='40' width='180' height='60' rx='22' fill='"+body+"'/>"+          // roof/cabin
      "<rect x='86' y='50' width='148' height='34' rx='12' fill='"+glass+"'/>"+          // windshield
      "<rect x='34' y='86' width='252' height='74' rx='18' fill='"+body+"'/>"+           // body
      "<rect x='34' y='86' width='252' height='74' rx='18' fill='none' stroke='"+dark+"' stroke-width='2'/>"+
      lamps+
      "<rect x='120' y='126' width='80' height='24' rx='4' fill='#fff' stroke='"+dark+"' stroke-width='1.5'/>"+  // plate
      plateTxt+
      "<circle cx='96' cy='168' r='24' fill='#2b2e33'/><circle cx='96' cy='168' r='10' fill='#565b63'/>"+
      "<circle cx='224' cy='168' r='24' fill='#2b2e33'/><circle cx='224' cy='168' r='10' fill='#565b63'/>"+
      "<text x='160' y='28' font-size='11' text-anchor='middle' font-family='system-ui,sans-serif' fill='#8a9099'>"+
        (rear?'REAR':'FRONT')+" &#183; demo photo</text></svg>";
    return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
  };

  function photoBtn(src, tag){
    return '<button type="button" class="veh-photo" data-rcpt-open data-rcpt-src="'+src+'" '+
           'aria-label="'+tag+' — tap to zoom"><img src="'+src+'" alt="Vehicle '+tag+'">'+
           '<span class="veh-tag">'+tag+'</span></button>';
  }

  // v = { frontPhoto, rearPhoto, year, make, model, color, plate }
  window.__vehicleCard = function(v){
    if(!v) return '';
    var front = v.frontPhoto || window.__demoCarPhoto(v.color, 'front');
    var rear  = v.rearPhoto  || window.__demoCarPhoto(v.color, 'rear');
    var name  = [v.year, v.make, v.model].filter(Boolean).join(' ') || 'Vehicle';
    var color = v.color || '';
    var plate = v.plate ? '<div class="veh-plate">Plate <b>'+v.plate+'</b></div>' : '';
    return '<div class="veh-card">'+
        '<div class="veh-head"><span class="veh-ico">🚗</span> Look for this vehicle</div>'+
        '<div class="veh-photos">'+ photoBtn(front,'Front') + photoBtn(rear,'Rear · plate') +'</div>'+
        '<div class="veh-meta">'+
          '<div class="veh-line"><span class="veh-name">'+name+'</span>'+
            (color ? '<span class="veh-color"><i class="veh-swatch" style="background:'+hexFor(color)+'"></i>'+color+'</span>' : '')+
          '</div>'+ plate +
        '</div>'+
      '</div>';
  };
})();
</script>
